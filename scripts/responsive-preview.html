<!doctype html><html lang="pt-BR"><meta charset="UTF-8"><title>QA responsiva ZM</title><style>body{margin:0;padding:18px;background:#dedfd7;color:#34352d;font:13px Arial}header{display:flex;align-items:center;gap:15px;margin-bottom:18px;flex-wrap:wrap}button{padding:10px;border:1px solid #aaa;background:#fff;cursor:pointer}#frames{display:flex;align-items:flex-start;gap:16px;width:max-content}.frame-card{background:#fff;padding:8px}h2{font-size:12px;margin:3px 0 9px}iframe{display:block;border:0;height:820px}.metric{font-size:11px;max-width:300px;line-height:1.6;margin-top:10px}</style><header><b>QA da loja</b><button data-view="">Hero</button><button data-view="#catalogo">Catálogo</button><button data-view="#admin">Admin</button><button id="metrics">Medir larguras</button></header><div id="frames"></div><script>const widths=new URLSearchParams(location.search).get('widths')?.split(',').map(Number)||[320,390,430];const height=Number(new URLSearchParams(location.search).get('height')||820);let route='';for(const width of widths){const card=document.createElement('section');card.className='frame-card';card.innerHTML=`<h2>${width} × ${height} px</h2><iframe title="Loja em ${width} pixels" width="${width}" style="height:${height}px" src="/"></iframe><div class="metric" role="status">Aguardando medição</div>`;document.querySelector('#frames').append(card)}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{route=b.dataset.view;document.querySelectorAll('iframe').forEach(f=>f.src='/'+route)});document.querySelector('#metrics').onclick=()=>document.querySelectorAll('.frame-card').forEach(card=>{const f=card.querySelector('iframe'),d=f.contentDocument,over=[...d.querySelectorAll('body *')].filter(e=>{const r=e.getBoundingClientRect(),s=f.contentWindow.getComputedStyle(e);return s.position!=='fixed'&&s.display!=='none'&&r.width&&(r.left < -1 || r.right>d.documentElement.clientWidth+1)&&!e.closest('.hero-orbit,.category-pills,.table-scroll,dialog')}).map(e=>e.className||e.tagName).slice(0,8);card.querySelector('.metric').textContent=`Viewport ${d.documentElement.clientWidth}px · página ${d.documentElement.scrollWidth}px · deslocamento ${d.documentElement.scrollLeft}px · ${over.length?'fora da largura: '+over.join(', '):'sem elementos fora da largura'}`});</script></html>
